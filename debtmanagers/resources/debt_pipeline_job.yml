# Daily job: one task per notebook, chained with dependencies. No cluster is set, so it runs on serverless.
resources:
  jobs:
    debt_collection_daily:
      name: debt_collection_daily
      max_concurrent_runs: 1            # two runs for the same day at once is how duplicates happen
      parameters:
        - name: run_date
          default: "{{job.trigger.time.iso_date}}"   # for the demo, run with run_date=2026-11-13, 14, 15
        - name: catalog
          default: workspace
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"        # 7am every day, after the bank file lands
        timezone_id: Pacific/Auckland
        pause_status: PAUSED
      # email_notifications:
      #   on_failure: [you@example.com]
      tasks:
        - task_key: bronze_ingest
          notebook_task: {notebook_path: ../notebooks/02_bronze_ingest.py}
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: silver_clients
          depends_on: [{task_key: bronze_ingest}]
          notebook_task: {notebook_path: ../notebooks/03_silver_clients.py}
        - task_key: silver_placements
          depends_on: [{task_key: silver_clients}]
          notebook_task: {notebook_path: ../notebooks/04_silver_placements.py}
        - task_key: silver_payments
          depends_on: [{task_key: silver_placements}]     # payments need accounts to match against
          notebook_task: {notebook_path: ../notebooks/05_silver_payments.py}
        - task_key: silver_contacts
          depends_on: [{task_key: silver_placements}]     # runs in parallel with payments
          notebook_task: {notebook_path: ../notebooks/06_silver_contacts.py}
        - task_key: gold_dimensions
          depends_on: [{task_key: silver_payments}, {task_key: silver_contacts}]
          notebook_task: {notebook_path: ../notebooks/07_gold_dimensions.py}
        - task_key: gold_facts
          depends_on: [{task_key: gold_dimensions}]
          notebook_task: {notebook_path: ../notebooks/08_gold_facts.py}
        - task_key: gold_kpi_views
          depends_on: [{task_key: gold_facts}]
          notebook_task: {notebook_path: ../notebooks/09_gold_kpi_views.py}
        - task_key: data_quality
          depends_on: [{task_key: gold_kpi_views}]
          notebook_task: {notebook_path: ../notebooks/10_data_quality.py}
