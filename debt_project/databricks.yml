# Databricks Asset Bundle: deploy the notebooks and the daily job with the Databricks CLI
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run debt_collection_daily -t dev
bundle:
  name: debt_collection_pipeline

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com   # change me
